<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Duty Automator - Sequential Fill</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 25%, rgba(72, 131, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 75%, rgba(153, 92, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.15) 0%, transparent 60%);
            animation: gradientShift 10s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.7; transform: scale(1); }
        }

        .floating-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        .orb1 { width: 200px; height: 200px; background: #4a8cff; top: 10%; left: 15%; animation-delay: 0s; }
        .orb2 { width: 150px; height: 150px; background: #9b5cff; bottom: 20%; right: 10%; animation-delay: 2s; }
        .orb3 { width: 100px; height: 100px; background: #00d4ff; top: 60%; left: 70%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .main-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 50px;
        }

        .live-datetime {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live-datetime .dot {
            width: 8px; height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6); }
            50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #4a8cff 0%, #a78bfa 50%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-bottom: 30px;
        }

        .file-group {
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: background 0.3s, border-color 0.3s;
        }
        .file-group:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
        }

        input[type="file"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
        }
        input[type="file"]:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }
        input[type="file"]::file-selector-button {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4a8cff, #a78bfa);
            color: #fff;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            margin-right: 12px;
            transition: opacity 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            opacity: 0.85;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4a8cff 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 4px 20px rgba(74, 140, 255, 0.3);
            letter-spacing: 0.5px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(74, 140, 255, 0.45);
        }
        .btn-primary:active {
            transform: translateY(0);
        }

        .sample-downloads {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .btn-sample {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s, transform 0.2s;
        }
        .btn-sample:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        #status {
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: 'Inter', monospace;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 191, 0, 0.12);
            border: 1px solid rgba(255, 191, 0, 0.25);
            padding: 14px;
            border-radius: 12px;
            display: none;
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
        }

        .password-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        }
        .password-overlay::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 30% 30%, rgba(72, 131, 255, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(153, 92, 255, 0.2) 0%, transparent 50%);
            pointer-events: none;
        }
        .password-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .password-card .lock-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .password-card h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #4a8cff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .password-card p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 24px;
        }
        .password-input-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .password-input-wrap input {
            width: 100%;
            padding: 14px 50px 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .password-input-wrap input:focus {
            border-color: #4a8cff;
            box-shadow: 0 0 0 3px rgba(74, 140, 255, 0.2);
        }
        .toggle-vis {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            width: auto;
            transition: color 0.2s;
        }
        .toggle-vis:hover { color: rgba(255, 255, 255, 0.7); }
        .password-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 12px;
            min-height: 20px;
        }
        .btn-unlock {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4a8cff 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(74, 140, 255, 0.3);
        }
        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(74, 140, 255, 0.45);
        }
        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .glass-card { padding: 24px; }
            h2 { font-size: 22px; }
            .sample-downloads { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="floating-orb orb1"></div>
<div class="floating-orb orb2"></div>
<div class="floating-orb orb3"></div>

<div class="password-overlay" id="passwordOverlay">
    <div class="password-card">
        <div class="lock-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="url(#lockGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <defs>
                    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#4a8cff"/>
                        <stop offset="100%" stop-color="#a78bfa"/>
                    </linearGradient>
                </defs>
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                <circle cx="12" cy="16" r="1"/>
            </svg>
        </div>
        <h3>Access Required</h3>
        <p>Enter the password to continue</p>
        <div class="password-input-wrap">
            <input type="password" id="passwordInput" placeholder="Enter password..." onkeydown="if(event.key==='Enter')checkPassword()">
            <button class="toggle-vis" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>
        <div class="password-error" id="passwordError"></div>
        <button class="btn-unlock" onclick="checkPassword()">Unlock</button>
    </div>
</div>

<div class="main-container" id="mainContent" style="filter: blur(8px); pointer-events: none; opacity: 0.3;">

    <div class="live-datetime">
        <span class="dot"></span>
        <span id="liveDateTime"></span>
    </div>

    <div class="glass-card">
        <h2>Train Duty Automation Tool</h2>
        <p class="subtitle">Sequential Blank Fill Logic — Upload, Process & Download</p>
        
        <div class="file-group">
            <label>1. Train Loop Verification File (CSV):</label>
            <input type="file" id="verifFile" accept=".csv">
        </div>

        <div class="file-group">
            <label>2. Down File (CSV):</label>
            <input type="file" id="downFile" accept=".csv">
        </div>

        <div class="file-group">
            <label>3. Up File (CSV):</label>
            <input type="file" id="upFile" accept=".csv">
        </div>

        <button class="btn-primary" onclick="runAutomation()">Process & Download Updated Files</button>

        <div class="sample-downloads">
            <button class="btn-sample" onclick="downloadSample('down')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Sample Down CSV
            </button>
            <button class="btn-sample" onclick="downloadSample('up')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Sample Up CSV
            </button>
        </div>

        <div id="status"></div>
    </div>

    <footer>
        &copy; <span id="copyrightYear"></span> Train Duty Automator. All rights reserved.
    </footer>

</div>

<script>
    const ACCESS_PASSWORD = 'admin123';

    function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        const error = document.getElementById('passwordError');
        if (input === ACCESS_PASSWORD) {
            document.getElementById('passwordOverlay').classList.add('hidden');
            document.getElementById('mainContent').style.filter = 'none';
            document.getElementById('mainContent').style.pointerEvents = 'auto';
            document.getElementById('mainContent').style.opacity = '1';
        } else {
            error.textContent = 'Incorrect password. Try again.';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }
    }

    function togglePasswordVisibility() {
        const input = document.getElementById('passwordInput');
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    function updateLiveDateTime() {
        const now = new Date();
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('liveDateTime').textContent = now.toLocaleDateString('en-US', options);
    }
    updateLiveDateTime();
    setInterval(updateLiveDateTime, 1000);

    document.getElementById('copyrightYear').textContent = new Date().getFullYear();

    const SAMPLE_DOWN = 'Train id,A,B,C,D\n';
    const SAMPLE_UP = 'train id,A,B,C,D\n';

    function downloadSample(type) {
        const csv = type === 'down' ? SAMPLE_DOWN : SAMPLE_UP;
        const filename = type === 'down' ? 'Sample_Down_File.csv' : 'Sample_Up_File.csv';
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    async function runAutomation() {
        const vIn = document.getElementById('verifFile').files[0];
        const dIn = document.getElementById('downFile').files[0];
        const uIn = document.getElementById('upFile').files[0];

        if (!vIn || !dIn || !uIn) {
            alert("Please upload all three files.");
            return;
        }

        updateLog("Reading and sorting verification file...");

        try {
            const verifRes = await parseCSV(vIn);
            const downRes = await parseCSV(dIn);
            const upRes = await parseCSV(uIn);

            let vData = verifRes.data.map(r => ({
                tid: String(r['Train id'] || r['train id'] || r['Rake Num'] || "").trim(),
                start: String(r['Start Stn'] || "").trim().toLowerCase(),
                end: String(r['End Stn'] || "").trim().toLowerCase(),
                time: String(r['Start Time'] || "").trim(),
                duty: String(r['Duty Num'] || "").trim()
            })).filter(r => r.tid);
            
            vData.sort((a, b) => a.time.localeCompare(b.time));

            const downSegs = [
                { s: 'mkpr', e: 'pbgw dn', col: 1 },
                { s: 'pbgw dn', e: 'ipe', col: 2 },
                { s: 'ipe', e: 'kkda dn', col: 3 },
                { s: 'kkda dn', e: 'mkpr', col: 4 }
            ];

            const upSegs = [
                { s: 'mkpr', e: 'kkda up', col: 1 },
                { s: 'kkda up', e: 'ipe', col: 2 },
                { s: 'ipe', e: 'pbgw up', col: 3 },
                { s: 'pbgw up', e: 'mkpr', col: 4 }
            ];

            const processFile = (fileData, segments, label) => {
                updateLog(`Processing ${label}...`);
                const headers = Object.keys(fileData[0]);
                const tidKey = headers[0];

                segments.forEach(seg => {
                    const colKey = headers[seg.col];
                    const dutiesForSeg = vData.filter(v => v.start === seg.s && v.end.includes(seg.e.split(' ')[0]));

                    dutiesForSeg.forEach(dutyRow => {
                        const trainId = dutyRow.tid;
                        const dutyNum = dutyRow.duty;

                        for (let i = 0; i < fileData.length; i++) {
                            const rowId = String(fileData[i][tidKey]).trim();
                            if (rowId === trainId) {
                                let currentVal = fileData[i][colKey];
                                if (!currentVal || currentVal.toString().trim() === "") {
                                    fileData[i][colKey] = dutyNum;
                                    break;
                                }
                            }
                        }
                    });
                });
                return fileData;
            };

            const updatedDown = processFile(downRes.data, downSegs, "Down File");
            const updatedUp = processFile(upRes.data, upSegs, "Up File");

            downloadCSV(updatedDown, "Updated_Down_File.csv");
            downloadCSV(updatedUp, "Updated_Up_File.csv");

            updateLog("Success! Both files have been updated and downloaded.");

        } catch (err) {
            console.error(err);
            updateLog("Error: " + err.message);
        }
    }

    function parseCSV(file) {
        return new Promise(resolve => {
            Papa.parse(file, { header: true, skipEmptyLines: true, complete: resolve });
        });
    }

    function downloadCSV(data, filename) {
        const csv = Papa.unparse(data);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function updateLog(msg) {
        const log = document.getElementById('status');
        log.style.display = "block";
        log.innerText += msg + "\n";
    }
</script>

</body>
</html>
