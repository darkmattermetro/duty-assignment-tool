<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Duty Automator - Sequential Fill</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            background: #0a0a1a;
            color: #fff;
            overflow-x: hidden;
        }

        canvas#bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background:
                linear-gradient(135deg,
                    rgba(139, 0, 255, 0.15) 0%,
                    rgba(0, 102, 255, 0.12) 25%,
                    rgba(0, 255, 200, 0.10) 50%,
                    rgba(255, 0, 128, 0.12) 75%,
                    rgba(255, 153, 0, 0.10) 100%);
            animation: bgShift 8s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes bgShift {
            0% { filter: hue-rotate(0deg); opacity: 0.8; }
            50% { opacity: 1; }
            100% { filter: hue-rotate(30deg); opacity: 0.8; }
        }

        .main-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 50px;
        }

        .live-datetime {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .live-datetime .dot {
            width: 8px; height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px #00ff88;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .glass-card {
            position: relative;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 44px;
            max-width: 720px;
            width: 100%;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .glass-card:hover { transform: translateY(-2px); }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 28px;
            padding: 1.5px;
            background: linear-gradient(135deg, #ff006e, #8338ec, #3a86ff, #06d6a0, #ffbe0b, #ff006e);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            background-size: 300% 300%;
            animation: borderFlow 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .shimmer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 55%, transparent 60%);
            background-size: 200% 100%;
            animation: shimmer 6s ease-in-out infinite;
            pointer-events: none;
            border-radius: 28px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        h2 {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff006e, #8338ec, #3a86ff, #06d6a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            background-size: 200% auto;
            animation: textGrad 3s ease-in-out infinite alternate;
        }
        @keyframes textGrad {
            0% { background-position: 0% center; }
            100% { background-position: 100% center; }
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            margin-bottom: 32px;
        }

        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            margin-right: 8px;
            vertical-align: middle;
        }
        .step1 .step-number { background: linear-gradient(135deg, #ff006e, #ff4d94); }
        .step2 .step-number { background: linear-gradient(135deg, #8338ec, #a855f7); }
        .step3 .step-number { background: linear-gradient(135deg, #3a86ff, #60a5fa); }

        .file-group {
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .file-group::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            border-radius: 0 4px 4px 0;
            transition: opacity 0.3s;
        }
        .step1 .file-group::before { background: linear-gradient(180deg, #ff006e, #ff4d94); }
        .step2 .file-group::before { background: linear-gradient(180deg, #8338ec, #a855f7); }
        .step3 .file-group::before { background: linear-gradient(180deg, #3a86ff, #60a5fa); }

        .file-group:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
        }

        input[type="file"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        input[type="file"]:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.07);
        }
        input[type="file"]:focus {
            outline: none;
            border-color: #3a86ff;
            box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.2);
        }
        input[type="file"]::file-selector-button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3a86ff, #8338ec);
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-right: 14px;
            transition: all 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff006e, #8338ec, #3a86ff);
            background-size: 200% 100%;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 30px rgba(131, 56, 236, 0.35);
            letter-spacing: 0.5px;
            animation: btnGrad 4s ease-in-out infinite alternate;
        }
        @keyframes btnGrad {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(131, 56, 236, 0.5);
        }
        .btn-primary:active { transform: translateY(0); }

        .sample-downloads {
            display: flex;
            gap: 14px;
            margin-top: 18px;
        }
        .btn-sample {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-sample:first-child { border-color: rgba(58, 134, 255, 0.3); }
        .btn-sample:last-child { border-color: rgba(6, 214, 160, 0.3); }
        .btn-sample:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }
        .btn-sample:first-child:hover { border-color: rgba(58, 134, 255, 0.5); box-shadow: 0 4px 20px rgba(58, 134, 255, 0.2); }
        .btn-sample:last-child:hover { border-color: rgba(6, 214, 160, 0.5); box-shadow: 0 4px 20px rgba(6, 214, 160, 0.2); }

        #status {
            margin-top: 22px;
            white-space: pre-wrap;
            font-family: 'Inter', monospace;
            font-size: 13px;
            color: #ffbe0b;
            background: rgba(255, 191, 11, 0.08);
            border: 1px solid rgba(255, 191, 11, 0.2);
            padding: 16px;
            border-radius: 14px;
            display: none;
        }

        footer {
            margin-top: 44px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
            padding: 16px 24px;
            background: rgba(255,255,255,0.03);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 600px) {
            .glass-card { padding: 28px 20px; }
            h2 { font-size: 24px; }
            .sample-downloads { flex-direction: column; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="bg-gradient"></div>

<div class="main-container" id="mainContent">

    <div class="live-datetime">
        <span class="dot"></span>
        <span id="liveDateTime"></span>
    </div>

    <div class="glass-card">
        <div class="shimmer"></div>
        <h2>Train Duty Automation Tool</h2>
        <p class="subtitle">Sequential Blank Fill Logic — Upload, Process & Download</p>
        
        <div class="step1">
            <div class="file-group">
                <label><span class="step-number">1</span>Train Loop Verification File (CSV)</label>
                <input type="file" id="verifFile" accept=".csv">
            </div>
        </div>

        <div class="step2">
            <div class="file-group">
                <label><span class="step-number">2</span>Down File (CSV)</label>
                <input type="file" id="downFile" accept=".csv">
            </div>
        </div>

        <div class="step3">
            <div class="file-group">
                <label><span class="step-number">3</span>Up File (CSV)</label>
                <input type="file" id="upFile" accept=".csv">
            </div>
        </div>

        <button class="btn-primary" onclick="runAutomation()">Process & Download Updated Files</button>

        <div class="sample-downloads">
            <button class="btn-sample" onclick="downloadSample('down')" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Sample Down CSV
            </button>
            <button class="btn-sample" onclick="downloadSample('up')" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Sample Up CSV
            </button>
        </div>

        <div id="status"></div>
    </div>

    <footer>
        &copy; <span id="copyrightYear"></span> Train Duty Automator. All rights reserved.
    </footer>

</div>

<script>
    function initParticles(canvasId) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return null;
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animFrame;
        const colors = ['#ff006e', '#8338ec', '#3a86ff', '#06d6a0', '#ffbe0b', '#fb5607'];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.speedY = (Math.random() - 0.5) * 1.2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = colors[(i + j) % colors.length];
                        ctx.globalAlpha = (1 - dist / 150) * 0.15;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            connectParticles();
            animFrame = requestAnimationFrame(animate);
        }
        animate();

        return {
            stop() { cancelAnimationFrame(animFrame); }
        };
    }

    const bgAnim = initParticles('bgCanvas');

    function updateLiveDateTime() {
        const now = new Date();
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('liveDateTime').textContent = now.toLocaleDateString('en-US', options);
    }
    updateLiveDateTime();
    setInterval(updateLiveDateTime, 1000);

    document.getElementById('copyrightYear').textContent = new Date().getFullYear();

    const SAMPLE_DOWN = 'Train id,A,B,C,D\n';
    const SAMPLE_UP = 'train id,A,B,C,D\n';

    function downloadSample(type) {
        const csv = type === 'down' ? SAMPLE_DOWN : SAMPLE_UP;
        const filename = type === 'down' ? 'Sample_Down_File.csv' : 'Sample_Up_File.csv';
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    async function runAutomation() {
        const vIn = document.getElementById('verifFile').files[0];
        const dIn = document.getElementById('downFile').files[0];
        const uIn = document.getElementById('upFile').files[0];

        if (!vIn || !dIn || !uIn) {
            alert("Please upload all three files.");
            return;
        }

        updateLog("Reading and sorting verification file...");

        try {
            const verifRes = await parseCSV(vIn);
            const downRes = await parseCSV(dIn);
            const upRes = await parseCSV(uIn);

            let vData = verifRes.data.map(r => ({
                tid: String(r['Train id'] || r['train id'] || r['Rake Num'] || "").trim(),
                start: String(r['Start Stn'] || "").trim().toLowerCase(),
                end: String(r['End Stn'] || "").trim().toLowerCase(),
                time: String(r['Start Time'] || "").trim(),
                duty: String(r['Duty Num'] || "").trim()
            })).filter(r => r.tid);
            
            vData.sort((a, b) => a.time.localeCompare(b.time));

            const downSegs = [
                { s: 'mkpr', e: 'pbgw dn', col: 1 },
                { s: 'pbgw dn', e: 'ipe', col: 2 },
                { s: 'ipe', e: 'kkda dn', col: 3 },
                { s: 'kkda dn', e: 'mkpr', col: 4 }
            ];

            const upSegs = [
                { s: 'mkpr', e: 'kkda up', col: 1 },
                { s: 'kkda up', e: 'ipe', col: 2 },
                { s: 'ipe', e: 'pbgw up', col: 3 },
                { s: 'pbgw up', e: 'mkpr', col: 4 }
            ];

            const processFile = (fileData, segments, label) => {
                updateLog(`Processing ${label}...`);
                const headers = Object.keys(fileData[0]);
                const tidKey = headers[0];

                segments.forEach(seg => {
                    const colKey = headers[seg.col];
                    const dutiesForSeg = vData.filter(v => v.start === seg.s && v.end.includes(seg.e.split(' ')[0]));

                    dutiesForSeg.forEach(dutyRow => {
                        const trainId = dutyRow.tid;
                        const dutyNum = dutyRow.duty;

                        for (let i = 0; i < fileData.length; i++) {
                            const rowId = String(fileData[i][tidKey]).trim();
                            if (rowId === trainId) {
                                let currentVal = fileData[i][colKey];
                                if (!currentVal || currentVal.toString().trim() === "") {
                                    fileData[i][colKey] = dutyNum;
                                    break;
                                }
                            }
                        }
                    });
                });
                return fileData;
            };

            const updatedDown = processFile(downRes.data, downSegs, "Down File");
            const updatedUp = processFile(upRes.data, upSegs, "Up File");

            downloadCSV(updatedDown, "Updated_Down_File.csv");
            downloadCSV(updatedUp, "Updated_Up_File.csv");

            updateLog("Success! Both files have been updated and downloaded.");

        } catch (err) {
            console.error(err);
            updateLog("Error: " + err.message);
        }
    }

    function parseCSV(file) {
        return new Promise(resolve => {
            Papa.parse(file, { header: true, skipEmptyLines: true, complete: resolve });
        });
    }

    function downloadCSV(data, filename) {
        const csv = Papa.unparse(data);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function updateLog(msg) {
        const log = document.getElementById('status');
        log.style.display = "block";
        log.innerText += msg + "\n";
    }
</script>

</body>
</html>
