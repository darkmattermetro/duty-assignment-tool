<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Train Duty Automator - Sequential Fill</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; padding: 40px; color: #333; }
        .card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        .file-group { margin-bottom: 20px; padding: 15px; background: #fafafa; border: 1px solid #e1e4e8; border-radius: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1557b0; }
        #status { margin-top: 20px; white-space: pre-wrap; font-family: monospace; font-size: 13px; color: #555; background: #fff3cd; padding: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Train Duty Automation Tool</h2>
    <p style="font-size: 13px; color: #666; text-align: center;">Updated: Feb 18, 2025 (Sequential Blank Fill Logic)</p>
    
    <div class="file-group">
        <label>1. Train Loop Verification File (CSV):</label>
        <input type="file" id="verifFile" accept=".csv">
    </div>

    <div class="file-group">
        <label>2. Down File (CSV):</label>
        <input type="file" id="downFile" accept=".csv">
    </div>

    <div class="file-group">
        <label>3. Up File (CSV):</label>
        <input type="file" id="upFile" accept=".csv">
    </div>

    <button onclick="runAutomation()">Process & Download Updated Files</button>
    <div id="status"></div>
</div>

<script>
    async function runAutomation() {
        const vIn = document.getElementById('verifFile').files[0];
        const dIn = document.getElementById('downFile').files[0];
        const uIn = document.getElementById('upFile').files[0];

        if (!vIn || !dIn || !uIn) {
            alert("Please upload all three files.");
            return;
        }

        updateLog("Reading and sorting verification file...");

        try {
            const verifRes = await parseCSV(vIn);
            const downRes = await parseCSV(dIn);
            const upRes = await parseCSV(uIn);

            // 1. Sort Verification File by Start Time
            let vData = verifRes.data.map(r => ({
                tid: String(r['Train id'] || r['train id'] || r['Rake Num'] || "").trim(),
                start: String(r['Start Stn'] || "").trim().toLowerCase(),
                end: String(r['End Stn'] || "").trim().toLowerCase(),
                time: String(r['Start Time'] || "").trim(),
                duty: String(r['Duty Num'] || "").trim()
            })).filter(r => r.tid);
            
            vData.sort((a, b) => a.time.localeCompare(b.time));

            // Logic Definitions
            const downSegs = [
                { s: 'mkpr', e: 'pbgw dn', col: 1 }, // Col B
                { s: 'pbgw dn', e: 'ipe', col: 2 },    // Col C
                { s: 'ipe', e: 'kkda dn', col: 3 },    // Col D
                { s: 'kkda dn', e: 'mkpr', col: 4 }     // Col E
            ];

            const upSegs = [
                { s: 'mkpr', e: 'kkda up', col: 1 },   // Col B
                { s: 'kkda up', e: 'ipe', col: 2 },    // Col C
                { s: 'ipe', e: 'pbgw up', col: 3 },    // Col D
                { s: 'pbgw up', e: 'mkpr', col: 4 }     // Col E
            ];

            const processFile = (fileData, segments, label) => {
                updateLog(`Processing ${label}...`);
                const headers = Object.keys(fileData[0]);
                const tidKey = headers[0];

                segments.forEach(seg => {
                    const colKey = headers[seg.col];
                    // Filter verification for this specific segment
                    const dutiesForSeg = vData.filter(v => v.start === seg.s && v.end.includes(seg.e.split(' ')[0]));

                    dutiesForSeg.forEach(dutyRow => {
                        const trainId = dutyRow.tid;
                        const dutyNum = dutyRow.duty;

                        // Find the first blank row for this Train ID
                        for (let i = 0; i < fileData.length; i++) {
                            const rowId = String(fileData[i][tidKey]).trim();
                            if (rowId === trainId) {
                                let currentVal = fileData[i][colKey];
                                if (!currentVal || currentVal.toString().trim() === "") {
                                    fileData[i][colKey] = dutyNum;
                                    break; // Duty assigned, move to next duty in verification
                                }
                            }
                        }
                    });
                });
                return fileData;
            };

            const updatedDown = processFile(downRes.data, downSegs, "Down File");
            const updatedUp = processFile(upRes.data, upSegs, "Up File");

            downloadCSV(updatedDown, "Updated_Down_File.csv");
            downloadCSV(updatedUp, "Updated_Up_File.csv");

            updateLog("Success! Both files have been updated and downloaded.");

        } catch (err) {
            console.error(err);
            updateLog("Error: " + err.message);
        }
    }

    function parseCSV(file) {
        return new Promise(resolve => {
            Papa.parse(file, { header: true, skipEmptyLines: true, complete: resolve });
        });
    }

    function downloadCSV(data, filename) {
        const csv = Papa.unparse(data);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function updateLog(msg) {
        const log = document.getElementById('status');
        log.style.display = "block";
        log.innerText += msg + "\n";
    }
</script>

</body>
</html>
